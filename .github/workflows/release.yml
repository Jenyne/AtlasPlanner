name: Release public

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(.+)$') { throw "Tag must look like v0.4.0, got $tag" }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish public zip
        shell: pwsh
        run: .\scripts\publish-public.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Atlas Planner ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: artifacts/AtlasPlanner-${{ steps.ver.outputs.version }}-win-x64.zip
          body: |
            Public Windows build (self-contained). Unzip and run `AtlasPlanner.Gui.exe`.

            This build does **not** include Send to game / the ExileAPI overlay.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
