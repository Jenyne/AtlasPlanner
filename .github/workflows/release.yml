name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(.+)$') { throw "Tag must look like v0.4.0, got $tag" }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish zip
        shell: pwsh
        run: .\scripts\publish-public.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Atlas Planner ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: artifacts/AtlasPlanner-${{ steps.ver.outputs.version }}-win-x64.zip
          body: |
            Windows build (self-contained). Unzip and run `AtlasPlanner.Gui.exe`.

            VirusTotal scan link is added automatically after upload.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  virustotal:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Scan release zip on VirusTotal
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          release_id: ${{ needs.publish.outputs.release_id }}
          update_release: true
          release_heading: "### VirusTotal"
          rate_limit: "4"
