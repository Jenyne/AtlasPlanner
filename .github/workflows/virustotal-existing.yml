name: VirusTotal existing release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  virustotal:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release id
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}" --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "Scanning release ${{ inputs.tag }} (id=$id)"

      - name: Scan release zip on VirusTotal
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          release_id: ${{ steps.rel.outputs.release_id }}
          update_release: true
          release_heading: "### VirusTotal"
          rate_limit: "4"
